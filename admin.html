<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Studio - SaaS</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="toastContainer" class="toast-container"></div>

  <div id="loginScreen" class="card login-container">
    <div class="logo" style="margin: 0 auto 20px auto;">SC</div>
    <h2>Accesso Studio</h2>
    <input type="email" id="adminEmail" placeholder="Email" style="margin-bottom:10px;">
    <input type="password" id="adminPassword" placeholder="Password" style="margin-bottom:20px;">
    <button class="primary full" onclick="loginAdmin()">Accedi</button>
  </div>

  <div id="adminDashboard">
    <aside class="sidebar">
      <h2>Pannello Studio</h2>
      <p id="displayTenantId" style="color: var(--primary); font-weight: bold; margin-bottom: 20px;"></p>
      <nav class="nav-v">
        <button onclick="showAdminPage('p-reports')" id="btn-p-reports" class="active">Segnalazioni</button>
        <button onclick="showAdminPage('p-assemblies')" id="btn-p-assemblies">Assemblee / Bacheca</button>
        <button onclick="showAdminPage('p-settings')" id="btn-p-settings">Impostazioni</button>
      </nav>
      <button class="secondary full" onclick="logoutAdmin()" style="margin-top:auto;">Esci</button>
    </aside>

    <main class="dashboard-content">
      <section id="p-reports" class="admin-page active">
        <div class="kpi-grid">
           <div class="kpi-card"><h4>Totale</h4><span id="kpi-total" class="kpi-val">0</span></div>
           <div class="kpi-card"><h4>Aperte</h4><span id="kpi-todo" class="kpi-val">0</span></div>
           <div class="kpi-card"><h4>Urgenti</h4><span id="kpi-urgent" class="kpi-val">0</span></div>
        </div>
        <input type="text" id="adminSearch" placeholder="Cerca guasto o condomino..." oninput="renderAdminReports()" style="margin-bottom: 20px;">
        <div id="adminReportsList" class="reports-list"></div>
      </section>

      <section id="p-assemblies" class="admin-page">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
          <div class="card">
            <h3>Nuova Convocazione</h3>
            <label>Titolo</label><input id="ass_title">
            <label>Data</label><input type="date" id="ass_date">
            <label>Ora</label><input type="time" id="ass_time">
            <label>Luogo</label><input id="ass_location">
            <label>Ordine del Giorno</label><textarea id="ass_content" rows="4"></textarea>
            <button class="primary full" onclick="publishAssembly('convocazione')">Pubblica Convocazione</button>
          </div>
          <div class="card">
            <h3>Pubblica Verbale</h3>
            <label>Titolo Verbale</label><input id="verb_title">
            <label>Testo / Sintesi</label><textarea id="verb_content" rows="11"></textarea>
            <button class="primary full" onclick="publishAssembly('verbale')">Pubblica Verbale</button>
          </div>
        </div>
        <h3 style="margin-top:30px;">Storico Bacheca</h3>
        <div id="adminAssembliesList" class="reports-list"></div>
      </section>

      <section id="p-settings" class="admin-page">
        <div class="card" style="max-width:600px;">
          <h3>Configurazione Profilo Studio</h3>
          <p style="color:var(--muted); font-size:14px;">Questi dati appariranno nell'app di tutti i condomini collegati al tuo Codice Studio.</p>
          <label>Nome App (es. Studio Rossi)</label><input id="admin_settingAppTitle">
          <label>Info / Slogan</label><input id="admin_settingCondominioName">
          <label>Nome Amministratore</label><input id="admin_settingAdminName">
          <label>Email Pubblica</label><input id="admin_settingAdminEmail">
          <label>Telefono / WhatsApp (formato +39...)</label><input id="admin_settingAdminPhone">
          <button class="primary full" onclick="saveGlobalSettings()">Salva Dati Studio</button>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="admin.js"></script>
</body>
</html>
