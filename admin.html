<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Segnalazioni Condominio</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background-color: #e8f2fb; }
    #adminDashboard { display: none; grid-template-columns: 280px 1fr; height: 100vh; }
    .sidebar { background: var(--primary-dark); color: white; padding: 30px 20px; display: flex; flex-direction: column; }
    .sidebar h2 { margin-bottom: 5px; font-size: 22px; }
    .sidebar p { opacity: 0.7; font-size: 14px; margin-bottom: 30px; }
    .login-container { max-width: 400px; margin: 10vh auto; padding: 40px; text-align: center; }
    .dashboard-content { padding: 30px; overflow-y: auto; }
    @media (max-width: 800px) {
      #adminDashboard { grid-template-columns: 1fr; }
      .sidebar { height: auto; padding: 20px; }
    }
  </style>
</head>
<body>

  <div id="toastContainer" class="toast-container"></div>

  <div id="loginScreen" class="card login-container">
    <div class="logo" style="margin: 0 auto 20px auto;">SC</div>
    <h2 style="margin-bottom: 20px;">Accesso Admin</h2>
    <input type="email" id="adminEmail" placeholder="Email Amministratore" style="margin-bottom: 10px;" />
    <input type="password" id="adminPassword" placeholder="Password" style="margin-bottom: 20px;" />
    <button class="primary full" onclick="loginAdmin()">Accedi al Pannello</button>
    <p id="loginError" class="hidden" style="color: var(--danger); margin-top: 15px; font-weight: bold;"></p>
  </div>

  <div id="adminDashboard">
    <aside class="sidebar">
      <h2>Studio Condominio</h2>
      <p>Pannello di Controllo</p>
      <div style="margin-top: auto;">
        <button class="secondary full" onclick="logoutAdmin()">Disconnetti Sicuro</button>
      </div>
    </aside>

    <main class="dashboard-content">
      
      <div class="toolbar" style="margin-bottom: 20px;">
        <h3>Gestione Segnalazioni e Chat</h3>
      </div>
      <div id="adminReportsList" class="reports-list">
        <p>Caricamento dati...</p>
      </div>

      <hr style="margin: 40px 0; border: 1px solid #dde5ef;">

      <div class="card" style="max-width: 600px;">
        <h3>Impostazioni Globali App</h3>
        <p style="color: var(--muted); font-size: 14px; margin-bottom: 20px;">
          Le modifiche salvate qui aggiorneranno istantaneamente l'app sui telefoni di tutti i condomini.
        </p>
        <label>Nome app (es. Condominio Roma)</label>
        <input type="text" id="admin_settingAppTitle" />
        <label>Sottotitolo / Info</label>
        <input type="text" id="admin_settingCondominioName" />
        <label>Nome Amministratore</label>
        <input type="text" id="admin_settingAdminName" />
        <label>Email di Contatto</label>
        <input type="email" id="admin_settingAdminEmail" />
        <label>Telefono / WhatsApp</label>
        <input type="tel" id="admin_settingAdminPhone" />
        <button class="primary full" onclick="saveGlobalSettings()">Salva e Distribuisci Dati</button>
      </div>

    </main>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
